    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Work Hours Calculator",
        "url": "https://hours-calculator.correia95.workers.dev/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Calculate worked hours between a start and end time minus breaks, as hours and minutes and decimal hours, with overnight-shift handling, a weekly timesheet and optional pay, entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I calculate hours worked between two times?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Subtract the start time from the end time, then take off any unpaid break. From 9:00 to 17:30 with a 30-minute break is 8 hours. If the shift finishes after midnight the calculator adds a day automatically."
            }
          },
          {
            "@type": "Question",
            "name": "What are decimal hours?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The worked minutes divided by 60. 8 hours 30 minutes is 8.5 decimal hours. Most payroll and invoicing systems want the decimal figure rather than hours and minutes."
            }
          },
          {
            "@type": "Question",
            "name": "How do I enter a time?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most formats work: 9, 9:30, 9.5, 0930, 9:30 am, 5pm, 17:00. A bare number under 24 is read as an hour; a decimal is read as hours, so 9.5 means 9:30."
            }
          },
          {
            "@type": "Question",
            "name": "Does it handle overtime?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Optionally. Add a pay rate, an overtime threshold and a multiplier, and hours above the threshold are paid at the higher rate. It is a simple threshold, not a substitute for your local overtime rules."
            }
          }
        ]
      }
    </script>
